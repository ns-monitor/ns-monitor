<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Let's Encrypt Root Certificates</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #12161f; color: #e5e7eb; }
        h1 { font-size: 22px; color: #60a5fa; }
        p { font-size: 16px; line-height: 1.5; }
        .cert-card { background: #1e2430; border: 1px solid #374151; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        .cert-card h2 { margin-top: 0; font-size: 18px; color: #f3f4f6; }
        .btn { display: inline-block; padding: 12px 20px; margin: 8px 8px 8px 0; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; }
        .btn-der { background: #059669; }
    </style>
</head>
<body>
    <h1>Download Root Certificates</h1>
    <p>Tap a certificate below to download and install it on this device:</p>

    <div class='cert-card'>
        <h2>ISRG Root X1 (Standard / RSA)</h2>
        <a class='btn' href='/static/isrgrootx1.crt' download>Download .CRT</a>
        <a class='btn btn-der' href='/static/isrgrootx1.der' download>Download .DER</a>
    </div>

    <div class='cert-card'>
        <h2>ISRG Root X2 (ECDSA)</h2>
        <a class='btn' href='/static/isrgrootx2.crt' download>Download .CRT</a>
        <a class='btn btn-der' href='/static/isrgrootx2.der' download>Download .DER</a>
    </div>
</body>
</html>
